function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;
  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    offsetRef.current = {
      x: Math.min(Math.max(PAD, window.innerWidth - w - PAD), Math.max(PAD, offsetRef.current.x)),
      y: Math.min(Math.max(PAD, window.innerHeight - h - PAD), Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);
  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);
  const dismiss = () => { setOpen(false); window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); };
  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy) };
      clampToViewport();
    };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };
  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={e => e.stopPropagation()} onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label }) { return <div className="twk-sect">{label}</div>; }
function TweakRow({ label, children }) {
  return (
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span></div>
      {children}
    </div>
  );
}
function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={e => onChange(e.target.value)}>
        {options.map(o => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

Object.assign(window, { useTweaks, TweaksPanel, TweakSection, TweakSelect });

const useScaleToFit = (w, h) => {
  const [scale, setScale] = React.useState(1);
  React.useEffect(() => {
    const calc = () => {
      const sw = window.innerWidth / (w + 60);
      const sh = window.innerHeight / (h + 60);
      setScale(Math.min(sw, sh, 1));
    };
    calc();
    window.addEventListener('resize', calc);
    return () => window.removeEventListener('resize', calc);
  }, [w, h]);
  return scale;
};

  if (err) return <Wordmark size={Math.round(height * 0.5)} color={inverted ? T.ink : T.paper} />;
  return (
    <img src={src} onError={() => setErr(true)}
      style={{ height, display: 'block', objectFit: 'contain' }} />
  );
}

      padding: '18px 28px',

      background: T.ink,

      alignItems: 'center', justifyContent: 'center',

      <div style={{
        position: 'absolute', top: '50%', left: '50%',
        transform: phase >= 1 ? 'translate(-50%, calc(-50% - 160px))' : 'translate(-50%, -50%)',
        opacity: phase < 2 ? 1 : 0,
        transition: 'transform 0.6s cubic-bezier(0.4,0,0.2,1), opacity 0.6s ease',
      }}>
        <SamLogo />
      </div>

      <div style={{
        textAlign: 'center', zIndex: 2,
        opacity: phase >= 1 ? 1 : 0,
        transform: phase >= 1 ? 'translateY(0)' : 'translateY(12px)',
        transition: 'opacity 0.6s ease, transform 0.6s ease',
      }}>
        <div style={{
          fontFamily: MONO, fontWeight: 500, fontSize: 11,
          letterSpacing: '0.08em', textTransform: 'uppercase',
          color: T.highlight, marginBottom: 20,
        }}>you're in</div>

        <div style={{
          fontFamily: SERIF,
          fontSize: 64, fontWeight: 400,
          color: T.paper, lineHeight: 0.95,
          letterSpacing: '-0.015em',
        }}>
          {teamName}
        </div>

        <div style={{
          fontFamily: SANS, fontSize: 16, fontWeight: 400,
          color: T.inkMid, marginTop: 18,
        }}>
          your scavenger hunt begins now
        </div>
      </div>

      <style>{`
        @keyframes ringExpand {
          from { transform: scale(0); opacity: 0; }
          to   { transform: scale(1); opacity: 1; }
        }
      `}</style>
    </div>
  );
}

/* ─────────────────────────────────────────
   SCREEN 3 & 4: RIDDLE
   User taps the painting to place a circle,
   then locks in. Reveals the correct zone.
───────────────────────────────────────── */
function RiddleScreen({ teamName, riddle, riddleIndex, totalRiddles, onDone }) {
  const [locked, setLocked] = React.useState(false);
  const [revealed, setRevealed] = React.useState(false);
  const [hintShown, setHintShown] = React.useState(false);
  /* Drawing state — all coordinates in px relative to the painting container */
  const [isDrawing, setIsDrawing] = React.useState(false);
  const [drawStart, setDrawStart] = React.useState(null);
  const [drawCurrent, setDrawCurrent] = React.useState(null);
  const [finalCircle, setFinalCircle] = React.useState(null);   // {cx,cy,r} px — user's drawn circle
  const [revealCircle, setRevealCircle] = React.useState(null); // {cx,cy,r} px — correct answer circle
  const containerRef = React.useRef(null);

  /* Compute the correct-answer circle in px once the panel collapses after reveal */
  React.useLayoutEffect(() => {
    if (!revealed || !containerRef.current) return;
    const rect = containerRef.current.getBoundingClientRect();
    setRevealCircle({
      cx: (riddle.target.x / 100) * rect.width,
      cy: (riddle.target.y / 100) * rect.height,
      r: 52,
    });
  }, [revealed]);

  /* Pointer helpers — works for mouse and touch via pointer events */
  const getPx = (e) => {
    const rect = containerRef.current.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e.changedTouches ? e.changedTouches[0] : e;
    return { x: src.clientX - rect.left, y: src.clientY - rect.top };
  };

  const handlePointerDown = (e) => {
    if (locked) return;
    e.preventDefault();
    const pos = getPx(e);
    setIsDrawing(true);
    setDrawStart(pos);
    setDrawCurrent(pos);
    setFinalCircle(null); // allow redrawing
  };

  const handlePointerMove = (e) => {
    if (!isDrawing || locked) return;
    e.preventDefault();
    setDrawCurrent(getPx(e));
  };

  const handlePointerUp = (e) => {
    if (!isDrawing) return;
    e.preventDefault();
    const pos = getPx(e);
    const dx = pos.x - drawStart.x;
    const dy = pos.y - drawStart.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 14) {
      setFinalCircle({
        cx: (drawStart.x + pos.x) / 2,
        cy: (drawStart.y + pos.y) / 2,
        r: dist / 2,
      });
    }
    setIsDrawing(false);
    setDrawStart(null);
    setDrawCurrent(null);
  };

  const handleLock = () => {
    if (!finalCircle || locked) return;
    setLocked(true);
    setTimeout(() => setRevealed(true), 300);
  };

  const isLast = riddleIndex === totalRiddles - 1;

  /* Live circle rendered while the user is actively dragging */
  const liveCircle = isDrawing && drawStart && drawCurrent ? {
    cx: (drawStart.x + drawCurrent.x) / 2,
    cy: (drawStart.y + drawCurrent.y) / 2,
    r: Math.max(1, Math.hypot(drawCurrent.x - drawStart.x, drawCurrent.y - drawStart.y) / 2),
  } : null;

  return (
    <div style={{
      width: '100%', height: '100%',
      background: T.paper,
      display: 'flex', flexDirection: 'column',
      color: T.ink, overflow: 'hidden',
    }}>
      <style>{`
        @keyframes labelFadeIn {
          from { opacity: 0; transform: translateY(6px); }
          to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes hintExpand {
          from { opacity: 0; transform: translateY(-6px); }
          to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes revealRing {
          0%   { opacity: 0; stroke-dashoffset: 400; }
          40%  { opacity: 1; }
          100% { opacity: 1; stroke-dashoffset: 0; }
        }
        @keyframes userRingSettle {
          0%   { stroke-width: 5; }
          100% { stroke-width: 3.5; }
        }
      `}</style>

      <ScreenHeader teamName={teamName} />

      {/* Progress bar */}
      <div style={{
        padding: '12px 40px 0',
        display: 'flex', alignItems: 'center', gap: 12,
        flexShrink: 0,
      }}>
        <div style={{
          fontFamily: MONO, fontWeight: 500, fontSize: 11,
          letterSpacing: '0.08em', textTransform: 'uppercase',
          color: T.inkMid,
        }}>
          {String(riddleIndex + 1).padStart(2, '0')} / {String(totalRiddles).padStart(2, '0')}
        </div>
        <div style={{ flex: 1, display: 'flex', gap: 4 }}>
          {Array.from({ length: totalRiddles }).map((_, i) => (
            <div key={i} style={{
              flex: 1, height: 2, borderRadius: 2,
              background: i <= riddleIndex ? T.ink : T.rule,
              opacity: i <= riddleIndex ? 1 : 0.4,
            }}/>
          ))}
        </div>
      </div>

      {/* Riddle panel — TOP, no button */}
      <div style={{
        flexShrink: 0,
        background: T.paper,
        borderBottom: revealed ? `2px solid ${T.highlight}` : `1px solid rgba(255,255,255,0.12)`,
        padding: '16px 40px 20px',
        transition: 'border-bottom-color 0.3s',
      }}>
        {!revealed ? (
          <>
            <div style={{
              fontFamily: MONO, fontWeight: 500, fontSize: 11,
              letterSpacing: '0.10em', textTransform: 'uppercase',
              color: T.highlight, marginBottom: 8,
            }}>
              riddle {riddle.index}
            </div>

            <p style={{
              fontFamily: SERIF, fontWeight: 400,
              fontSize: 28, lineHeight: 1.2,
              color: T.ink, letterSpacing: '-0.01em',
              marginBottom: 14,
            }}>
              {riddle.question}
            </p>

            {/* Hint chip → expands to hint text */}
            {!hintShown ? (
              <button
                onClick={(e) => { e.stopPropagation(); setHintShown(true); }}
                style={{
                  display: 'inline-flex', alignItems: 'center', gap: 6,
                  background: 'transparent',
                  border: `1.5px solid ${T.rule}`,
                  color: T.inkMid,
                  padding: '5px 14px', borderRadius: 999,
                  fontFamily: MONO, fontSize: 10, fontWeight: 500,
                  letterSpacing: '0.07em', textTransform: 'uppercase',
                  cursor: 'pointer',
                  transition: 'border-color 0.2s, color 0.2s',
                }}
                onMouseEnter={e => { e.currentTarget.style.borderColor = T.ink; e.currentTarget.style.color = T.ink; }}
                onMouseLeave={e => { e.currentTarget.style.borderColor = T.rule; e.currentTarget.style.color = T.inkMid; }}
              >
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round">
                  <circle cx="12" cy="12" r="10"/>
                  <path d="M12 16v-4M12 8h.01"/>
                </svg>
                need a hint?
              </button>
            ) : (
              <div style={{
                display: 'flex', alignItems: 'flex-start', gap: 10,
                padding: '10px 14px',
                background: T.paperDim,
                border: `1.5px solid ${T.rule}`,
                borderRadius: 12,
                animation: 'hintExpand 0.3s ease-out',
              }}>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke={T.highlight} strokeWidth="2.5" strokeLinecap="round" style={{ flexShrink: 0, marginTop: 2 }}>
                  <circle cx="12" cy="12" r="10"/>
                  <path d="M12 16v-4M12 8h.01"/>
                </svg>
                <span style={{
                  fontFamily: SANS, fontSize: 14, fontWeight: 400,
                  color: T.inkSoft, lineHeight: 1.5,
                }}>
                  {riddle.hint}
                </span>
              </div>
            )}
          </>
        ) : (
          <>
            <div style={{
              fontFamily: MONO, fontWeight: 500, fontSize: 11,
              letterSpacing: '0.10em', textTransform: 'uppercase',
              color: T.highlight, marginBottom: 8,
              animation: 'labelFadeIn 0.4s ease-out',
            }}>
              nice find
            </div>
            <p style={{
              fontFamily: SERIF, fontWeight: 400,
              fontSize: 26, lineHeight: 1.2,
              color: T.ink, letterSpacing: '-0.01em',
              margin: 0,
              animation: 'labelFadeIn 0.4s 0.1s both ease-out',
            }}>
              {isLast
                ? "You found both hidden details. Now let's dig into what makes this painting so special."
                : "Got it. Ready for the next one?"}
            </p>
          </>
        )}
      </div>

      {/* Painting area — MIDDLE, fills remaining space */}
      <div
        ref={containerRef}
        onPointerDown={handlePointerDown}
        onPointerMove={handlePointerMove}
        onPointerUp={handlePointerUp}
        style={{
          flex: 1,
          position: 'relative',
          overflow: 'hidden',
          touchAction: 'none',
          userSelect: 'none',
          cursor: locked ? 'default' : 'crosshair',
        }}
      >
        {/* Painting */}
        <div style={{
          position: 'absolute', inset: 0,
          backgroundImage: "url('./jacob-lawrence.jpg')",
          backgroundSize: 'cover',
          backgroundPosition: 'center',
          backgroundRepeat: 'no-repeat',
        }} />

        {/* Draw instruction — only before first stroke */}
        {!finalCircle && !isDrawing && !locked && (
          <div style={{
            position: 'absolute', top: 16, left: '50%',
            transform: 'translateX(-50%)',
            background: 'rgba(14,14,12,0.72)',
            color: T.inkSoft,
            padding: '7px 16px', borderRadius: 999,
            fontFamily: MONO, fontSize: 10, fontWeight: 500,
            letterSpacing: '0.07em', textTransform: 'uppercase',
            whiteSpace: 'nowrap',
            pointerEvents: 'none',
          }}>
            draw a circle around your answer
          </div>
        )}

        {/* SVG overlay — all circles live here */}
        <svg style={{
          position: 'absolute', inset: 0,
          width: '100%', height: '100%',
          pointerEvents: 'none', overflow: 'visible',
        }}>
          {/* Live ghost circle while dragging */}
          {liveCircle && (
            <circle
              cx={liveCircle.cx} cy={liveCircle.cy} r={liveCircle.r}
              fill="rgba(200,52,26,0.06)"
              stroke={T.highlight}
              strokeWidth="2.5"
              strokeDasharray="6 4"
              opacity="0.8"
            />
          )}

          {/* User's finalised drawn circle */}
          {finalCircle && (
            <circle
              cx={finalCircle.cx} cy={finalCircle.cy} r={finalCircle.r}
              fill="rgba(200,52,26,0.08)"
              stroke={T.highlight}
              strokeWidth="3.5"
              opacity={revealed ? 0.45 : 1}
              style={{ transition: 'opacity 0.4s' }}
            />
          )}

          {/* Correct-answer reveal ring */}
          {revealCircle && (
            <circle
              cx={revealCircle.cx} cy={revealCircle.cy} r={revealCircle.r}
              fill="rgba(244,239,226,0.15)"
              stroke={T.ink}
              strokeWidth="3"
              strokeDasharray="380"
              strokeDashoffset="0"
              style={{ animation: 'revealRing 0.7s cubic-bezier(0.4,0,0.2,1) both' }}
            />
          )}
        </svg>

        {/* Reveal label — absolutely positioned below the correct circle */}
        {revealCircle && (
          <div style={{
            position: 'absolute',
            left: `${riddle.target.x}%`,
            top: `calc(${riddle.target.y}% + ${revealCircle.r + 12}px)`,
            transform: 'translateX(-50%)',
            background: T.ink, color: T.paper,
            padding: '5px 12px', borderRadius: 999,
            fontFamily: MONO, fontSize: 10, fontWeight: 700,
            letterSpacing: '0.06em', textTransform: 'uppercase',
            whiteSpace: 'nowrap',
            pointerEvents: 'none',
            animation: 'labelFadeIn 0.4s 0.5s both ease-out',
          }}>
            {riddle.revealLabel}
          </div>
        )}
      </div>

      {/* Button — pinned to bottom */}
      <div style={{
        flexShrink: 0,
        padding: '16px 40px 32px',
        background: T.paper,
        borderTop: `1px solid rgba(255,255,255,0.08)`,
      }}>
        {!revealed ? (
          <PillButton onClick={handleLock} disabled={!finalCircle || locked} variant="primary">
            lock it in
          </PillButton>
        ) : (
          <PillButton onClick={onDone} variant="accent"
            style={{ animation: 'labelFadeIn 0.4s 0.2s both ease-out' }}>
            {isLast ? 'see fun facts →' : 'next riddle →'}
          </PillButton>
        )}
      </div>
    </div>
  );
}

          <rect x="80" y="235" width="40" height="4" rx="2" fill={tabletStroke}/>
          {/* NFC target zone on screen */}
          <circle cx="100" cy="182" r="9"
            fill="none" stroke={T.highlight} strokeWidth="1.5" strokeDasharray="3 2"/>

          {/* Tap glow on screen — pulses when brochure contacts */}
          <circle cx="100" cy="182" r="18" fill={T.highlight} opacity="0"
            style={{ animation: 'tapGlow 2.4s 0.1s cubic-bezier(0.4,0,0.2,1) infinite' }}/>

          {/* NFC circular ripples from contact point */}
          {[0,1,2].map(i => (
            <circle key={i} cx="100" cy="182" r={18 + i * 14}
              fill="none" stroke={T.highlight} strokeWidth="1"
              opacity="0"
              style={{ animation: `nfcWave 2.4s ${0.15 + i * 0.18}s ease-out infinite` }}/>
          ))}

          {/* ── Brochure / pamphlet card ── */}
          {/* Animates from resting above → taps down onto the tablet face */}
          <g style={{
            animation: 'brochureTap 2.4s cubic-bezier(0.4,0,0.2,1) infinite',
            transformOrigin: '100px 54px',
          }}>
            {/* Card body */}
            <rect x="66" y="10" width="68" height="88" rx="8"
              fill={brochureFill} stroke={brochureStroke} strokeWidth="1.5"/>
            {/* Text lines */}
            <rect x="76" y="24" width="48" height="5" rx="2.5" fill={lineC}/>
            <rect x="76" y="34" width="36" height="4" rx="2"   fill={lineC}/>
            <rect x="76" y="47" width="48" height="3" rx="1.5" fill={lineC}/>
            <rect x="76" y="55" width="40" height="3" rx="1.5" fill={lineC}/>
            <rect x="76" y="63" width="44" height="3" rx="1.5" fill={lineC}/>
            {/* NFC sticker — red circle at bottom-centre of brochure */}
            <circle cx="100" cy="84" r="10" fill={T.highlight} opacity="0.92"/>
            <circle cx="100" cy="84" r="5"  fill="rgba(255,255,255,0.30)"/>

        </svg>
      </div>

      {/* Text */}
      <div style={{ textAlign: 'center', padding: '0 56px', position: 'relative', zIndex: 1 }}>
        <div style={{
          fontFamily: MONO, fontWeight: 500, fontSize: 11,
          letterSpacing: '0.10em', textTransform: 'uppercase',
          color: eyebrowC, marginBottom: 14,
        }}>
          {isSave ? 'save to collection' : 'start game'}
        </div>
        <div style={{
          fontFamily: SERIF, fontSize: 40, fontWeight: 400,
          lineHeight: 1.1, letterSpacing: '-0.015em',
          color: headingC, marginBottom: 16,
        }}>
          Tap your NFC sticker
        </div>
        <div style={{
          fontFamily: SANS, fontSize: 17, fontWeight: 400,
          color: subC, lineHeight: 1.5,
        }}>
          {isSave
            ? 'Hold your sticker near the reader to save this painting to your collection.'
            : 'Hold your sticker near the reader to begin the scavenger hunt.'}
        </div>
      </div>

      {/* Tap hint */}
      <div style={{
        position: 'absolute', bottom: 40,
        fontFamily: MONO, fontSize: 10, fontWeight: 500,
        letterSpacing: '0.07em', textTransform: 'uppercase',
        color: hintC,
      }}>
        tap anywhere to simulate NFC tap
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────
   SCREEN: SAVING (painting saved animation)
───────────────────────────────────────── */
function SavingScreen({ onDone, teamName }) {
  const [phase, setPhase] = React.useState(0); // 0 saving → 1 saved

  React.useEffect(() => {
    const t1 = setTimeout(() => setPhase(1), 900);
    const t2 = setTimeout(() => onDone(), 2600);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, []);

  return (
    <div style={{
      width: '100%', height: '100%',
      background: T.paper,
      display: 'flex', flexDirection: 'column',
      alignItems: 'center', justifyContent: 'center',
      color: T.ink, gap: 32,
    }}>
      <style>{`
        @keyframes checkDraw {
          from { stroke-dashoffset: 40; opacity: 0; }
          to   { stroke-dashoffset: 0; opacity: 1; }
        }
        @keyframes thumbIn {
          from { opacity: 0; transform: scale(0.88) translateY(16px); }
          to   { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes savingPulse {
          0%,100% { opacity: 0.5; }
          50%      { opacity: 1; }
        }
      `}</style>

      {/* Painting thumbnail + check badge */}
      <div style={{ position: 'relative', animation: 'thumbIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both' }}>
        <div style={{
          width: 200, height: 148,
          borderRadius: 16, overflow: 'hidden',
          border: `2px solid rgba(255,255,255,0.15)`,
          boxShadow: '0 16px 48px rgba(0,0,0,0.5)',
          backgroundImage: "url('./jacob-lawrence.jpg')",
          backgroundSize: 'cover',
          backgroundPosition: 'center',
        }} />

        {/* Check badge */}
        <div style={{
          position: 'absolute', bottom: -14, right: -14,
          width: 44, height: 44, borderRadius: '50%',
          background: phase >= 1 ? T.highlight : T.paperDim,
          border: `3px solid ${T.paper}`,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          transition: 'background 0.4s ease',
        }}>
          {phase < 1 ? (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke={T.inkMid} strokeWidth="2.5" strokeLinecap="round"
              style={{ animation: 'savingPulse 1s ease-in-out infinite' }}>
              <circle cx="12" cy="12" r="9" strokeDasharray="4 3"/>
            </svg>
          ) : (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="#fff" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <polyline points="4 12 9 17 20 6"
                strokeDasharray="40" strokeDashoffset="0"
                style={{ animation: 'checkDraw 0.45s 0.05s cubic-bezier(0.4,0,0.2,1) both' }}/>
            </svg>
          )}
        </div>
      </div>

      {/* Status text */}
      <div style={{ textAlign: 'center', padding: '0 48px' }}>
        <div style={{
          fontFamily: SERIF, fontSize: 36, fontWeight: 400,
          lineHeight: 1.1, letterSpacing: '-0.015em',
          color: T.ink, marginBottom: 16,
          transition: 'opacity 0.4s',
        }}>
          {phase < 1 ? 'Saving…' : 'Painting saved to your collection'}
        </div>

        {/* Team name — fades in with the confirmation */}
        {teamName && (
          <div style={{
            display: 'inline-flex', alignItems: 'center', gap: 8,
            border: `1.5px solid rgba(255,255,255,0.22)`,
            padding: '6px 16px', borderRadius: 999,
            fontFamily: MONO, fontWeight: 500, fontSize: 11,
            letterSpacing: '0.06em', textTransform: 'uppercase',
            color: T.inkSoft,
            marginBottom: 16,
            opacity: phase >= 1 ? 1 : 0,
            transition: 'opacity 0.5s 0.15s',
          }}>
            <span style={{ width: 6, height: 6, borderRadius: '50%', background: T.highlight, flexShrink: 0 }}/>
            {teamName}
          </div>
        )}

        <div style={{
          fontFamily: SANS, fontSize: 16, fontWeight: 400,
          color: T.inkMid, lineHeight: 1.5,
          opacity: phase >= 1 ? 1 : 0,
          transition: 'opacity 0.5s 0.3s',
        }}>
          The Studio by Jacob Lawrence is now in your collection.
        </div>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────
   MAIN APP
───────────────────────────────────────── */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "screen": "idle"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
  const [screen, setScreen] = React.useState('idle');
  const [teamName, setTeamName] = React.useState('');
  const [riddleIndex, setRiddleIndex] = React.useState(0);

  const scale = useScaleToFit(768, 1024);

  /* ── Save flow ── */
  const handleSaveClick = () => setScreen('nfc-save');
  const handleNfcSave   = () => {
    if (!teamName) setTeamName(TEAM_NAMES[Math.floor(Math.random() * TEAM_NAMES.length)]);
    setScreen('saving');
  };
  const handleSavingDone = () => setScreen('collection');
  const handleCollectionReturn = () => setScreen('idle');

  /* ── Game flow ── */
  const handleGameClick = () => setScreen('nfc-game');
  const handleNfcGame   = () => {
    const name = TEAM_NAMES[Math.floor(Math.random() * TEAM_NAMES.length)];
    setTeamName(name);
    setRiddleIndex(0);
    setScreen('unlock');
  };

  const handleUnlockDone = () => setScreen('riddle');

  const handleRiddleDone = () => {
    if (riddleIndex < RIDDLES.length - 1) {
      setRiddleIndex(i => i + 1);
      setScreen('__transition__');
      setTimeout(() => setScreen('riddle'), 20);
    } else {
      setScreen('facts');
    }
  };

  const handleFactsDone = () => setScreen('map');
  const handleReset = () => { setTeamName(''); setRiddleIndex(0); setScreen('idle'); };

  const renderScreen = () => {
    switch (screen) {
      case 'idle':
        return <IdleScreen onSave={handleSaveClick} onGame={handleGameClick} />;
      case 'nfc-save':
        return <NfcScreen mode="save" onTap={handleNfcSave} />;
      case 'saving':
        return <SavingScreen onDone={handleSavingDone} teamName={teamName} />;
      case 'collection':
        return <CollectionScreen onReturn={handleCollectionReturn} />;
      case 'nfc-game':
        return <NfcScreen mode="game" onTap={handleNfcGame} />;
      case 'unlock':
        return <UnlockScreen teamName={teamName} onComplete={handleUnlockDone} />;
      case 'riddle':
        return (
          <RiddleScreen
            key={riddleIndex}
            teamName={teamName}
            riddle={RIDDLES[riddleIndex]}
            riddleIndex={riddleIndex}
            totalRiddles={RIDDLES.length}
            onDone={handleRiddleDone}
          />
        );
      case 'facts':
        return <FactsScreen teamName={teamName} onDone={handleFactsDone} />;
      case 'map':
        return <MapScreen teamName={teamName} onReset={handleReset} />;
      default:
        return null;
    }
  };

  /* Jump-to-screen via tweaks panel */
  const screenOptions = ['idle', 'nfc-save', 'saving', 'collection', 'nfc-game', 'unlock', 'riddle 1', 'riddle 2', 'facts', 'map'];
  const currentLabel = screen === 'riddle' ? `riddle ${riddleIndex + 1}` : screen;

  const handleJump = (v) => {
    if (!['idle', 'nfc-save', 'saving', 'collection', 'nfc-game'].includes(v) && !teamName)
      setTeamName(TEAM_NAMES[0]);
    if (v === 'idle')          { handleReset(); }
    else if (v === 'nfc-save') { setScreen('nfc-save'); }
    else if (v === 'saving')   { setScreen('saving'); }
    else if (v === 'collection'){ setScreen('collection'); }
    else if (v === 'nfc-game') { setScreen('nfc-game'); }
    else if (v === 'unlock')   { setScreen('unlock'); }
    else if (v === 'riddle 1') { setRiddleIndex(0); setScreen('riddle'); }
    else if (v === 'riddle 2') { setRiddleIndex(1); setScreen('riddle'); }
    else if (v === 'facts')    { setScreen('facts'); }
    else if (v === 'map')      { setScreen('map'); }
  };

  return (
    <>
      <div style={{
        transform: `scale(${scale})`,
        transformOrigin: 'center center',
        transition: 'transform 0.2s ease',
      }}>
        <div className="tablet-shell" data-screen-label={`Tablet — ${screen}`}>
          <div style={{
            position: 'absolute', top: 14, left: 0, right: 0,
            display: 'flex', justifyContent: 'center',
            zIndex: 100, pointerEvents: 'none',
          }}>
            <div style={{
              width: 100, height: 5,
              background: 'rgba(255,255,255,0.15)',
              borderRadius: 10,
            }}/>
          </div>

          <div className="tablet-screen">
            <div style={{ position: 'absolute', inset: 0 }}>
              {renderScreen()}
            </div>
          </div>
        </div>

      </div>

      <window.TweaksPanel title="Jump to screen">
        <window.TweakSection label="navigation" />
        <window.TweakSelect
          label="jump to screen"
          options={screenOptions}
          value={screenOptions.find(o => o === currentLabel) || 'idle'}
          onChange={handleJump}
        />
      </window.TweaksPanel>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
